# Local Docker project id (container name prefix). Not the Lovable cloud ref.
project_id = "local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Local app origins (Vite / Lovable sandbox default 8080).
site_url = "http://localhost:8080"
additional_redirect_urls = [
  "http://localhost:8080/**",
  "http://localhost:3000/**",
  "http://localhost:5173/**",
  "http://127.0.0.1:8080/**",
  "http://127.0.0.1:3000/**",
  "http://127.0.0.1:5173/**",
  "http://localhost:8080/auth",
  "http://localhost:3000/auth",
  "http://localhost:5173/auth",
  "http://127.0.0.1:8080/auth",
  "http://127.0.0.1:3000/auth",
  "http://127.0.0.1:5173/auth",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local: skip confirm for password signup. Magic links / recovery still send email via Inbucket.
enable_confirmations = false

[auth.sms]
enable_signup = false

# Supabase OAuth 2.1 server (Aura as IdP for third-party clients).
# Cloud: enable under Authentication → OAuth Server and set path `/oauth/consent`.
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[realtime]
enabled = true

[analytics]
enabled = false
