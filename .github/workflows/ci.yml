name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Test · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      success: ${{ steps.mark-success.outputs.success }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint src --max-warnings 200

      - name: Unit tests
        run: npm test

      - name: Typecheck (non-blocking — exactOptionalPropertyTypes debt)
        run: npx tsc --noEmit -p tsconfig.json
        continue-on-error: true

      - name: Production build
        env:
          NITRO_PRESET: node-server
          NODE_ENV: production
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role
        run: npm run build

      - name: Mark success
        id: mark-success
        run: echo "success=true" >> $GITHUB_OUTPUT
