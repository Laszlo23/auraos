<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07090e" />
    <title>Offline — Aura OS</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        font-family: Manrope, system-ui, sans-serif;
        background: #07090e;
        color: #e8eef7;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-family: Sora, system-ui, sans-serif;
        font-size: 1.75rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0;
        opacity: 0.72;
        max-width: 28rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        color: #7dd3c7;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You’re offline</h1>
      <p>
        Aura OS needs a connection to run your company. Reconnect and we’ll pick up where you left
        off.
      </p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
